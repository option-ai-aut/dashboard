<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposal Code eingeben - option.ai</title>
    <style>
        /* SF Pro Font Import */
        @font-face {
            font-family: 'SF Pro';
            src: url('./bilder/SF-Pro-Text-Regular.otf') format('opentype');
            font-weight: 400;
            font-style: normal;
        }
        
        @font-face {
            font-family: 'SF Pro';
            src: url('./bilder/SF-Pro-Text-Medium.otf') format('opentype');
            font-weight: 500;
            font-style: normal;
        }
        
        @font-face {
            font-family: 'SF Pro';
            src: url('./bilder/SF-Pro-Text-Bold.otf') format('opentype');
            font-weight: 700;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e6edf3;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            padding: 20px;
        }

        .container {
            background: #0a0a0a;
            border-radius: 24px;
            padding: 60px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .logo {
            margin-bottom: 32px;
        }

        .logo img {
            height: 48px;
            width: auto;
        }

        h1 {
            font-family: 'SF Pro Display', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: #e6edf3;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 16px;
            color: #7d8590;
            margin-bottom: 40px;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 15px;
            font-weight: 500;
            color: #e6edf3;
            margin-bottom: 8px;
            text-align: left;
        }

        .form-input {
            width: 100%;
            padding: 16px;
            border: 1.5px solid rgba(125, 133, 144, 0.3);
            border-radius: 8px;
            font-size: 17px;
            background: rgba(48, 54, 61, 0.3);
            color: #e6edf3;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'SF Pro', sans-serif;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #007aff;
            box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1);
        }

        .form-input::placeholder {
            color: #7d8590;
            text-transform: none;
            letter-spacing: normal;
        }

        .btn-primary {
            width: 100%;
            background: #007aff;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 16px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 16px;
        }

        .btn-primary:hover {
            background: #0056cc;
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            background: #7d8590;
            cursor: not-allowed;
            transform: none;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: rgba(255, 59, 48, 0.1);
            border: 1px solid rgba(255, 59, 48, 0.2);
            color: #ff3b30;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 15px;
            margin-top: 16px;
            margin-bottom: 24px;
            display: none;
        }


        .divider {
            display: flex;
            align-items: center;
            margin: 32px 0;
            color: #7d8590;
            font-size: 15px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(125, 133, 144, 0.3);
        }

        .divider span {
            padding: 0 16px;
        }

        .link-dashboard {
            background: transparent;
            color: #007aff;
            border: 1.5px solid #007aff;
            border-radius: 8px;
            padding: 16px;
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .link-dashboard:hover {
            background: rgba(0, 122, 255, 0.04);
        }

        @media (max-width: 480px) {
            .container {
                padding: 40px 24px;
                margin: 16px;
            }
            
            h1 {
                font-size: 20px;
            }
            
            .subtitle {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="./Bilder/option Logo White.png" alt="option.ai" />
        </div>
        
        <h1>Proposal Code eingeben</h1>
        <p class="subtitle">Geben Sie Ihren Proposal-Code ein, um Ihr Angebot zu laden und zu unterschreiben.</p>

        <!-- Error Messages -->
        <div id="errorMessage" class="error-message"></div>

        <!-- Proposal Code Form -->
        <form id="proposalForm">
            <div class="form-group">
                <label for="proposalCode" class="form-label">Proposal Code</label>
                <input 
                    type="text" 
                    id="proposalCode" 
                    name="proposalCode"
                    class="form-input"
                    placeholder="z.B. PROP-2024-001"
                    required
                    autocomplete="off"
                >
            </div>
            
            <button type="submit" class="btn-primary" id="submitButton">
                Angebot laden
            </button>
        </form>

        <div class="divider">
            <span>oder</span>
        </div>
        
        <a href="/client-login.html" class="link-dashboard">
            Kunden-Dashboard öffnen
        </a>
    </div>

    <script>
        document.getElementById('proposalForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const proposalCode = document.getElementById('proposalCode').value.trim().toUpperCase();
            const errorDiv = document.getElementById('errorMessage');
            const submitBtn = document.getElementById('submitButton');
            
            // Reset error messages
            errorDiv.style.display = 'none';
            
            if (!proposalCode) {
                showError('Bitte geben Sie einen Proposal Code ein.');
                return;
            }
            
            // Validate format
            if (!proposalCode.match(/^PROP-/)) {
                showError('Der Proposal Code muss mit "PROP-" beginnen.');
                return;
            }
            
            // Set loading state
            setLoading(submitBtn, true);
            
            try {
                // Call API to validate proposal code with longer timeout
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 30000); // 30 second timeout
                
                const response = await fetch(`https://optionai.optionai.at/webhook/get-client?proposal_code=${encodeURIComponent(proposalCode)}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                
                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    throw new Error(`Proposal Code nicht gefunden oder ungültig. (Status: ${response.status})`);
                }
                
                const rawResponse = await response.text();
                console.log('Raw response as text:', rawResponse);
                
                let data;
                try {
                    data = JSON.parse(rawResponse);
                } catch (parseError) {
                    console.error('JSON parse error:', parseError);
                    throw new Error('Ungültige Response vom Server.');
                }
                
                console.log('Parsed data:', data);
                console.log('Type of data:', typeof data);
                console.log('Is Array:', Array.isArray(data));
                
                if (Array.isArray(data)) {
                    console.log('Data is array, length:', data.length);
                    if (data.length > 0) {
                        console.log('First item:', data[0]);
                        console.log('First item keys:', Object.keys(data[0]));
                        data = data[0]; // Take first item if it's an array
                    }
                }
                
                console.log('Final data object:', data);
                console.log('Object keys:', data ? Object.keys(data) : 'no keys');
                
                if (!data) {
                    throw new Error('Keine Daten erhalten.');
                }
                
                // Try different ways to access Proposal Code
                const proposalCodeFromResponse = data['Proposal Code'] || data.proposalCode || data['proposal_code'] || data.ProposalCode;
                console.log('Found Proposal Code:', proposalCodeFromResponse);
                
                if (!proposalCodeFromResponse) {
                    console.error('Proposal Code not found in any format. Available keys:', Object.keys(data));
                    // Don't throw error, just proceed - maybe the API structure is different
                    console.warn('Proceeding without Proposal Code validation');
                }
                
                // Additional debug info
                console.log('Template present:', !!data.Template);
                console.log('Custom HTML present:', !!data['Custom HTML']);
                
                // Store proposal code and redirect to signature page
                sessionStorage.setItem('proposalCode', proposalCode);
                sessionStorage.setItem('clientData', JSON.stringify(data));
                
                console.log('Stored data, redirecting to proposal.html');
                
                // Redirect to proposal page
                window.location.href = '/proposal';
                
            } catch (error) {
                console.error('Fetch error:', error);
                if (error.name === 'AbortError') {
                    showError('Die Anfrage hat zu lange gedauert. Bitte versuchen Sie es erneut.');
                } else {
                    showError(error.message || 'Ein Fehler ist aufgetreten. Bitte versuchen Sie es erneut.');
                }
            } finally {
                setLoading(submitBtn, false);
            }
        });
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function setLoading(button, isLoading) {
            if (isLoading) {
                button.disabled = true;
                button.innerHTML = '<span class="loading-spinner"></span>Wird verarbeitet...';
            } else {
                button.disabled = false;
                button.innerHTML = 'Angebot laden';
            }
        }
        
        // Auto-format proposal code input
        document.getElementById('proposalCode').addEventListener('input', function(e) {
            let value = e.target.value.toUpperCase().replace(/[^A-Z0-9-]/g, '');
            
            // Add PROP- prefix if not present
            if (value && !value.startsWith('PROP-')) {
                value = 'PROP-' + value.replace(/^PROP-?/, '');
            }
            
            e.target.value = value;
        });
    </script>
</body>
</html>
